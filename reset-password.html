<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset hasła DiveBuddy</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eaf7fb;
      color: #062f46;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .box {
      width: 100%;
      max-width: 460px;
      background: white;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 12px 35px rgba(0,0,0,.12);
    }

    h1 {
      margin-top: 0;
      font-size: 34px;
    }

    p {
      color: #607b88;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 18px 0 8px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #c5dbe4;
      font-size: 18px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: 0;
      border-radius: 16px;
      background: #1187ad;
      color: white;
      font-size: 18px;
      font-weight: 700;
    }

    #message {
      margin-top: 18px;
      font-weight: 700;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="box">
    <h1>🤿 Ustaw nowe hasło</h1>
    <p>Wpisz nowe hasło do swojego konta DiveBuddy.</p>

    <label>Nowe hasło</label>
    <input id="password" type="password" minlength="6" placeholder="Minimum 6 znaków" />

    <label>Powtórz hasło</label>
    <input id="password2" type="password" minlength="6" placeholder="Powtórz hasło" />

    <button id="save">Zapisz nowe hasło</button>

    <div id="message"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nowy-projekt-do-verce.vercel.app';
    const SUPABASE_KEY = 'sb_publishable_R_ADJ7kHEy8CKA_1PziPhQ_XP4nThe4';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function prepareSession() {
      const params = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(window.location.hash.substring(1));

      const code = params.get('code');
      const accessToken = hash.get('access_token');
      const refreshToken = hash.get('refresh_token');

      if (code) {
        const { error } = await client.auth.exchangeCodeForSession(code);
        if (error) throw error;
      } else if (accessToken && refreshToken) {
        const { error } = await client.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });
        if (error) throw error;
      }
    }

    async function main() {
      const message = document.getElementById('message');

      try {
        await prepareSession();
      } catch (e) {
        message.textContent = 'Link resetu jest nieprawidłowy lub wygasł.';
      }

      document.getElementById('save').onclick = async () => {
        const password = document.getElementById('password').value;
        const password2 = document.getElementById('password2').value;

        if (password.length < 6) {
          message.textContent = 'Hasło musi mieć minimum 6 znaków.';
          return;
        }

        if (password !== password2) {
          message.textContent = 'Hasła nie są takie same.';
          return;
        }

        message.textContent = 'Zapisywanie...';

        const { error } = await client.auth.updateUser({
          password
        });

        if (error) {
          message.textContent = 'Błąd: ' + error.message;
          return;
        }

        message.textContent = '✅ Hasło zostało zmienione. Możesz wrócić do aplikacji DiveBuddy i się zalogować.';
      };
    }

    main();
  </script>
</body>
</html>
